<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<style>
  :root{--bg:#0b0f14;--card:#121820;--line:#1f2937;--text:#e5edf5;--mut:#8b98a5;--acc:#4f9cf9;--ok:#34d399;--warn:#fbbf24}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:16px/1.7 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:920px;margin:0 auto;padding:0 20px}
  header{padding:20px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .brand{font-weight:700;letter-spacing:.3px}
  .brand a{color:var(--text);text-decoration:none}
  nav a{color:var(--mut);text-decoration:none;margin-left:18px;font-size:14px}
  nav a:hover{color:var(--text)}
  main{padding:36px 0 24px}
  h1{font-size:clamp(24px,4vw,34px);line-height:1.25;margin-bottom:14px}
  h2{font-size:21px;margin:30px 0 12px}
  h3{font-size:16px;margin:20px 0 8px}
  p{margin:10px 0}
  a{color:var(--acc)}
  blockquote{border-left:3px solid var(--line);padding:4px 14px;color:var(--mut);margin:14px 0}
  table{width:100%;border-collapse:collapse;font-size:14px;margin:14px 0}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
  code{font:13px/1.6 ui-monospace,Consolas,monospace;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  pre{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto;margin:14px 0}
  pre code{border:none;background:none;padding:0}
  ul,ol{padding-left:22px;margin:10px 0}
  li{margin:5px 0}
  hr{border:none;border-top:1px solid var(--line);margin:26px 0}
  .mut{color:var(--mut)}
  footer{border-top:1px solid var(--line);margin-top:30px;padding:22px 0 44px;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<header class="wrap">
  <div class="brand"><a href="/">China Model Monitor</a></div>
  <nav>
    <a href="/providers/">Providers</a>
    <a href="/changes/">Changes</a>
    <a href="/about/">About</a>
  </nav>
</header>
<main class="wrap">
  {{ content }}
</main>
<footer>
  <div class="wrap">
    Independent weekly-verified reference for Chinese AI model APIs. Not affiliated with any provider — model names are used descriptively. Last site-wide verification: see each page's "Last verified" line.
  </div>
</footer>
</body>
</html>
